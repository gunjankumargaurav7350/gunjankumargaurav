trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: docs
    displayName: Markdown Lint
    jobs:
      - job: markdown_lint
        displayName: Lint Documentation
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: |
              npx markdownlint-cli "**/*.md" --ignore node_modules || true
            displayName: Markdown Lint
