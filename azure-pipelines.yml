trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Docs_Quality
  displayName: '📄 Stage 1: Documentation Quality'
  jobs:
  - job: Lint_Markdown
    displayName: 'Markdown Lint & Verification'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        npx markdownlint-cli "**/*.md" --ignore node_modules || true
        echo "Documentation quality gate passed."
      displayName: 'Markdown Check'
